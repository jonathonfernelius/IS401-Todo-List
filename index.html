<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="assets/coursewise-favicon.ico?v=5" sizes="any">
<link rel="icon" href="assets/coursewise-favicon.png?v=5" type="image/png" sizes="64x64">
<script src="js/theme.js?v=transitions-4"></script>
<link rel="stylesheet" href="css/styles.css?v=transitions-4">
<title>Log in — Coursewise</title>
<meta name="description" content="Coursewise keeps Canvas assignments and personal to-dos in one calm place.">
</head>
<body data-page="login">
<div class="auth"><aside class="auth-aside"><a class="brand" href="index.html"><img class="brand-logo" src="assets/coursewise-logo-white.png" alt="Coursewise"></a>
<div><h1>Classes and life, on one short list.</h1><p>Canvas assignments and personal to-dos, together in one calm place.</p></div><span>Made for students.</span></aside>
<main class="auth-main"><form class="auth-form" id="auth-form">
<h2>Log in</h2>
<div class="field"><label for="u">Email</label><input id="u" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
<button class="btn btn-primary btn-block">Log in</button>
<div class="auth-links"><button type="button" class="link-btn" id="forgot">Forgot password?</button><a class="link" href="signup.html">Create an account</a></div>
</form></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/supabase.js"></script><script src="js/store.js?v=transitions-4"></script><script src="js/ui.js?v=transitions-4"></script><script src="js/auth.js"></script>

</body></html>
