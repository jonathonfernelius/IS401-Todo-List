<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<title>Log in — Tidy</title>
<meta name="description" content="Tidy keeps Canvas assignments and personal to-dos in one calm place.">
</head>
<body data-page="login">
<div class="auth"><aside class="auth-aside"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span>Tidy</a>
<div><h1>Classes and life, on one short list.</h1><p>Canvas assignments and personal to-dos, together in one calm place.</p></div><span>Made for students.</span></aside>
<main class="auth-main"><form class="auth-form" id="auth-form">
<h2>Log in</h2>
<div class="field"><label for="u">Email</label><input id="u" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
<button class="btn btn-primary btn-block">Log in</button>
<div class="auth-links"><button type="button" class="link-btn" id="forgot">Forgot password?</button><a class="link" href="signup.html">Create an account</a></div>
</form></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/supabase.js"></script><script src="js/store.js"></script><script src="js/ui.js"></script><script src="js/auth.js"></script>

</body></html>
